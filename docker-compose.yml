services:
  xyzzy:
    build: .
    container_name: xyzzy
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Europe/Rome
      CATALINA_OPTS: "-Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - metessi-net

networks:
  metessi-net:
    external: true
